name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    # 必需检查上下文按「检查运行名」匹配而非 job id：main 的 ruleset 要求名为
    # test 的检查，job 显示名必须固定为这个字面量（matrix 两腿同名，
    # 规则语义 = 两条腿都成功才满足）。改名会让所有 PR 永远 BLOCKED。
    name: test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [22, 24]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      # 契约测试直接加载 dist/index.cjs，必须先构建再测试
      - name: Build
        run: npm run build

      - name: Tests
        run: npm test

      # 覆盖率只在 node 24 job 上跑一次，避免重复上传
      - name: Tests with coverage
        if: matrix.node-version == 24
        run: npm run test:coverage

      - name: Upload to Codecov
        if: matrix.node-version == 24
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage/lcov.info
          fail_ci_if_error: false

      # 源码哈希 vs 产物同步闸门（防止改了 TS 忘了构建的静默失效）
      - name: Check sync gate
        run: npm run check-sync

      - name: Upload plugin artifact
        if: matrix.node-version == 24
        uses: actions/upload-artifact@v7
        with:
          name: ripples-of-aion-plugin
          path: dist/plugin/ripples-of-aion/
          if-no-files-found: error
