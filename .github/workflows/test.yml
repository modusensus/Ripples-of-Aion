name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: Typecheck / Test / Build (node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [22, 24]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      # 契约测试直接加载 dist/index.cjs，必须先构建再测试
      - name: Build
        run: npm run build

      - name: Tests
        run: npm test

      # 覆盖率只在 node 24 job 上跑一次，避免重复上传
      - name: Tests with coverage
        if: matrix.node-version == 24
        run: npm run test:coverage

      - name: Upload to Codecov
        if: matrix.node-version == 24
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage/lcov.info
          fail_ci_if_error: false

      # 源码哈希 vs 产物同步闸门（防止改了 TS 忘了构建的静默失效）
      - name: Check sync gate
        run: npm run check-sync

      - name: Upload plugin artifact
        if: matrix.node-version == 24
        uses: actions/upload-artifact@v4
        with:
          name: suiyue-lianyi-plugin
          path: dist/plugin/suiyue-lianyi/
          if-no-files-found: error
