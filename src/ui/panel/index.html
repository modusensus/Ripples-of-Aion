<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <title>岁月涟漪 · 记忆图谱</title>
  <style>
    /* 昔涟粉风格：珍珠白底 + 樱粉强调，圆角软阴影 */
    :root { color-scheme: light; }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 0 16px 24px;
      font-family: "Microsoft YaHei", "PingFang SC", sans-serif;
      background: linear-gradient(175deg, #fff8fb 0%, #fdeef5 55%, #fbe3ee 100%);
      color: #5c4650;
      /* 必须正好等于视口高：矮一截的话 body 背景在根部截断，
         渐变按平铺重复露出起始的近白色，页面底部会出现一条白带 */
      min-height: 100vh;
    }
    /* 无框窗口的自绘标题栏：整条是拖动区（负 margin 撑满窗口宽度），
       关闭按钮单独豁免 no-drag；双击拖动区走系统默认的最大化/还原 */
    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      margin: 0 -16px 4px;
      padding: 0 10px 0 16px;
      height: 42px;
      -webkit-app-region: drag;
      user-select: none;
    }
    .titlebar-text { display: flex; align-items: baseline; gap: 8px; min-width: 0; }
    #close-btn {
      -webkit-app-region: no-drag;
      flex: none;
      width: 30px;
      height: 30px;
      border: none;
      border-radius: 9px;
      background: transparent;
      color: #c2788f;
      font-size: 14px;
      font-family: system-ui, sans-serif;
      line-height: 1;
      cursor: pointer;
      transition: background 0.15s, color 0.15s;
    }
    #close-btn:hover { background: #fdeef4; color: #d96a90; }
    #close-btn:active { background: #f9dce8; }
    h1 {
      font-size: 16px;
      margin: 0;
      font-weight: 700;
      letter-spacing: 0.5px;
      background: linear-gradient(90deg, #e05a85, #f08bab);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }
    .header-sub { font-size: 11px; color: #c79aa9; }
    #stats {
      font-size: 12px;
      color: #b58a99;
      margin: 0 0 14px;
      display: flex;
      gap: 6px;
      align-items: center;
    }
    #stats .pill {
      background: #fff;
      border: 1px solid #f5d7e2;
      border-radius: 999px;
      padding: 2px 10px;
      color: #d96a90;
    }
    h2 {
      font-size: 12px;
      font-weight: 600;
      color: #c2788f;
      letter-spacing: 2px;
      margin: 18px 0 8px;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    h2::before {
      content: "";
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: linear-gradient(135deg, #ec6a8e, #f7a8c0);
    }
    .card {
      background: #fff;
      border: 1px solid #f6dce6;
      border-radius: 14px;
      box-shadow: 0 3px 14px rgba(224, 90, 133, 0.07);
      padding: 4px 14px;
      margin-bottom: 8px;
    }
    /* 实体时间轴 */
    .entity-block { padding: 10px 0 6px; }
    .entity-block + .entity-block { border-top: 1px dashed #f6dce6; }
    .entity-name { font-size: 13px; font-weight: 700; color: #d96a90; margin-bottom: 6px; }
    .attr-row { display: flex; gap: 10px; padding: 3px 0 3px 2px; }
    .attr-rail {
      flex: none;
      width: 14px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .attr-dot {
      width: 9px;
      height: 9px;
      border-radius: 50%;
      margin-top: 5px;
      flex: none;
    }
    .attr-dot.current { background: linear-gradient(135deg, #ec6a8e, #f7a8c0); box-shadow: 0 0 0 3px #fce3ec; }
    .attr-dot.past { background: #f0dbe3; box-shadow: none; }
    .attr-rail .rail-line { flex: 1; width: 1px; background: #f6dce6; margin-top: 2px; }
    .attr-body { flex: 1; min-width: 0; }
    .attr-line { font-size: 12.5px; line-height: 1.55; }
    .attr-line b { color: #c2597d; font-weight: 600; }
    .attr-value { color: #463158; font-weight: 600; }
    .attr-span { font-size: 11px; color: #c9a2b0; margin-left: 4px; }
    .attr-line.past-line { color: #b49aa4; }
    .attr-line.past-line .attr-value { color: #a58f9a; font-weight: 500; }
    /* 最近记忆列表 */
    #memory-list { list-style: none; margin: 0; padding: 0; }
    #memory-list li {
      display: flex;
      align-items: flex-start;
      gap: 10px;
      padding: 9px 2px;
    }
    #memory-list li + li { border-top: 1px solid #fbeef3; }
    .memory-body { flex: 1; min-width: 0; }
    .memory-content { font-size: 12.5px; line-height: 1.6; word-break: break-word; white-space: pre-wrap; color: #5c4650; }
    .memory-time { font-size: 10.5px; color: #c9a2b0; margin-top: 3px; }
    .forget-btn {
      flex: none;
      font-size: 11px;
      color: #d96a90;
      background: transparent;
      border: 1px solid #f2c3d3;
      border-radius: 999px;
      padding: 2px 10px;
      cursor: pointer;
      transition: background 0.15s;
    }
    .forget-btn:hover { background: #fdeef4; }
    .forget-btn:disabled { opacity: 0.45; cursor: default; }
    .empty { justify-content: center; color: #c9a2b0; }
    footer { margin-top: 16px; text-align: center; font-size: 10.5px; color: #dcb6c3; }
    /* 布局：窄视口单列堆叠；宽视口（默认窗口 720+）时间轴与最近记忆并排 */
    .layout { display: grid; grid-template-columns: 1fr; }
    @media (min-width: 720px) {
      .layout {
        grid-template-columns: minmax(0, 6fr) minmax(0, 5fr);
        gap: 0 14px;
        align-items: start;
      }
    }
  </style>
</head>
<body>
  <header>
    <div class="titlebar-text">
      <h1>岁月涟漪</h1>
      <span class="header-sub">Ripples of Aion · 记忆图谱</span>
    </div>
    <button id="close-btn" type="button" title="关闭">✕</button>
  </header>
  <p id="stats"><span class="pill">加载中…</span></p>

  <main class="layout">
    <section>
      <h2>实体时间轴</h2>
      <div id="claim-list" class="card"><div class="entity-block"><div class="attr-line empty">加载中…</div></div></div>
    </section>

    <section>
      <h2>最近记忆</h2>
      <ul id="memory-list" class="card">
        <li class="empty">加载中…</li>
      </ul>
    </section>
  </main>

  <footer>岁月无声，涟漪有痕</footer>
  <script src="./panel.js"></script>
</body>
</html>
